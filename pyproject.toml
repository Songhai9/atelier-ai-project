[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atelier-ai"
version = "0.1.0"
description = "Personalised fashion recommendations for client advisors."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=2.0.0",
    "kaleido>=1.5.0",
    "lightgbm[scikit-learn]==4.7.0",
    "matplotlib>=3.11.2",
    "mlflow-skinny>=3,<4",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pyyaml==6.0.3",
    "seaborn>=0.13.2",
]

[project.optional-dependencies]
api = [
    "fastapi==0.162.0",
    "pydantic==2.14.1",
    "uvicorn==0.54.0",
]
ui = [
    "httpx==0.28.1",
    "pydantic==2.14.1",
    "streamlit==1.66.1",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "ipykernel>=6.29,<8",
    "jupyterlab>=4.3,<5",
    "nbclient>=0.10,<1",
    "nbformat>=5,<6",
    "pytest>=9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]
