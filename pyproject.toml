[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atelier-ai"
version = "0.1.0"
description = "Personalised fashion recommendations for client advisors."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=2.0.0",
    "kaleido>=1.5.0",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29,<8",
    "jupyterlab>=4.3,<5",
    "pytest>=9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]
